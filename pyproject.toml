[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-analytics"
version = "0.1.0"
description = "Predict cricket shot effectiveness from ball-by-ball data"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=cricket_analytics --cov-report=term-missing"

[tool.coverage.run]
source = ["cricket_analytics"]

[tool.coverage.report]
show_missing = true
