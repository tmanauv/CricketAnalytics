[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-analytics"
version = "0.1.0"
description = "Cricket shot-effectiveness study extracted from SDP.ipynb"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "openpyxl>=3.1,<4.0",
    "scikit-learn>=1.3,<1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `tools/` holds scripts rather than a package, and `src/` is only installed in
# CI; both are importable from the tests without an editable install.
pythonpath = ["src", "tools"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cricket_analytics", "make_synthetic_dataset"]
