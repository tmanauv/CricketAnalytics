name: fixture-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Only what the fixture generator and its tests need — the modelling
        # stack (tensorflow, xgboost, catboost) is not exercised here.
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0,<3.0" "numpy>=1.24,<3.0" "openpyxl>=3.1,<4.0" pytest
      - name: Run tests
        run: pytest tests/ -v
      - name: Generate a workbook end to end
        run: |
          python tools/make_synthetic_dataset.py --output "Cricket Data Set.xlsx"
          python tools/make_synthetic_dataset.py --output data/invalid.xlsx --invalid
